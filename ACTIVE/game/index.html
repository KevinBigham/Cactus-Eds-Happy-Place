function applyBodyShape(actor,stateName){
var body=actor&&actor.body;
var key=bodyShapeKey(stateName||currentStateName(actor));

if (actor._cehpLastShapeState== null) actor._cehpLastShapeState=null;
if (actor._cehpLastShapeState===key) return false;

if (body.setSize) body.setSize(dims.w,dims.h,true);
else {
body.width=dims.w;
body.height=dims.h;
}

}

}
function applySquash(actor,kind,fallClass){
var p5;

if (!actor) return false;

if (!spec) return false;

p5=ensurePhase5(actor);
p5.squashX=spec[0];
p5.squashY=spec[1];
p5.squashMs=spec[2];
p5.squashDurationMs=spec[2];
setActorScale(actor,spec[0],spec[1]);

}
function updateSquash(actor,dtMs){
var p5;
var t;
var sx;
var sy;
if (!actor||!actor._cehpPhase5||actor._cehpPhase5.squashMs<=0) return false;
p5=actor._cehpPhase5;
p5.squashMs=Math.max(0,p5.squashMs-(dtMs||16));
t=p5.squashDurationMs>0?1-(p5.squashMs/p5.squashDurationMs):1;
if (p5.squashMs<=0) {
setActorScale(actor,1,1);
p5.squashX=1;
p5.squashY=1;
return false;
}
sx=p5.squashX+((1-p5.squashX)*t);
sy=p5.squashY+((1-p5.squashY)*t);
setActorScale(actor,sx,sy);

}
function actorForEvent(layer,payload){

function emitLanding(actor,p5){

actor: actor,
x: actor.x,
y: actor.y,

natural: true

}
function updatePhase5Motion(actor){
var p5=ensurePhase5(actor);
var grounded=isGrounded(actor);
var vx=getVelX(actor);
var moving=grounded&&Math.abs(vx)>RUN_START_VEL_EPSILON;
var stateName=currentStateName(actor);
if (moving&&!p5.wasMoving) applySquash(actor,'runStart');
if (grounded&&p5.lastVx*vx<0&&Math.abs(p5.lastVx)>SKID_VEL_EPSILON&&Math.abs(vx)>SKID_VEL_EPSILON) {

applySquash(actor,'skid');
}

p5.airborne=true;
p5.peakY=actor.y;
p5.naturalFall=true;
} else if (actor.y<p5.peakY) {

function sheetFrameForState(actor){

var v=actor&&actor._cehpBreatheState?actor._cehpBreatheState.v:0;

if (stateName==='idle') return actor&&actor._cehpBlinkMs>0?1:step%3;

if (stateName==='dash') return 15+(step%2);

if (stateName==='wallJump') return 20;

if (stateName==='crouch') return 23+(step%2);
if (stateName==='slide') return 25;
if (stateName==='ranged'||stateName==='melee') return 26;
if (stateName==='iFrameHurt'||stateName==='hitStop') return 27;

actor._cehpAimImage.y=(actor._cehpAimY<0?aimUpY:aimDownY)*visualY*baseScale;
actor._cehpAimImage.scaleX=facingScale*visualX*baseScale;
actor._cehpAimImage.scaleY=visualY*baseScale;

if (actor._cehpRimCyan&&actor._cehpRimCyan.setTexture) actor._cehpRimCyan.setTexture(nextBodyKey);
if (actor._cehpRimMagenta&&actor._cehpRimMagenta.setTexture) actor._cehpRimMagenta.setTexture(nextBodyKey);

(function(ns){

function makeState(runState){

runState: runState || null
};
}
function clipboardItems(){
return ['RESUME', 'LOCKER', 'POSTER'];
}
function lines(state){
var runState = state.runState || {};
var receipt = runState.receipt || null;
if (state.surface === 'clipboard') {
return [
'CLIPBOARD PAUSE',
(state.cursor === 0 ? '> ' : '  ') + 'RESUME',
(state.cursor === 1 ? '> ' : '  ') + 'LOCKER',
(state.cursor === 2 ? '> ' : '  ') + 'POSTER'
];
}
if (state.surface === 'locker') {
return [
'LOCKER SAVE MENU',
'CASE ' + (runState.caseSeed || 'UNFILED'),
'RUNS ' + (runState.runs || 0),
'DEATHS ' + (runState.deaths || 0),
receipt ? receipt.lines[0] : 'NO RECEIPT FILED'
];
}
return [
'TRAINING POSTER',
'Z SPACE JUMP',
'J PUNCH  K KICK',
'L HOLD DASH',
'C COPTER V SLAM',
'B GLIDE ESC PAUSE'
];
}
function openSurface(state, surface){
state.open = true;
state.surface = surface;
state.cursor = 0;
return state;
}
function move(state, dir){
if (state.surface !== 'clipboard') return state;
var items = clipboardItems();
state.cursor = (state.cursor + dir + items.length) % items.length;
return state;
}
function activate(state){
if (state.surface !== 'clipboard') return openSurface(state, 'clipboard');
var items = clipboardItems();
var next = items[state.cursor];
if (next === 'RESUME') {
state.open = false;
return state;
}
if (next === 'LOCKER') return openSurface(state, 'locker');
if (next === 'POSTER') return openSurface(state, 'poster');
return state;
}
function back(state){
if (state.surface === 'clipboard') {
state.open = false;
return state;
}
return openSurface(state, 'clipboard');
}
function bindSettingsForm(){
if (typeof document === 'undefined') return;
var form = document.getElementById('cehp-settings-form');
if (!form || form._cehpBound) return;
form._cehpBound = true;
var save = ns.SAVE && ns.SAVE.boot ? ns.SAVE.boot() : null;
if (save && save.assistMode) {
for (var key in save.assistMode) {
if (!ns.has(save.assistMode, key)) continue;
if (form.elements[key]) form.elements[key].checked = !!save.assistMode[key];
}
}
form.addEventListener('submit', function(ev){
ev.preventDefault();
if (!ns.SAVE || !ns.SAVE.boot || !ns.SAVE.save) return;
var payload = ns.SAVE.boot();
for (var k in payload.assistMode) {
if (!ns.has(payload.assistMode, k)) continue;
if (form.elements[k]) payload.assistMode[k] = !!form.elements[k].checked;
}
ns.SAVE.save(payload);
});
}
bindSettingsForm();
ns.UI = {
makeState: makeState,
lines: lines,
move: move,
activate: activate,
back: back,
openClipboard: function(state){ return openSurface(state, 'clipboard'); },
openLocker: function(state){ return openSurface(state, 'locker'); },
openPoster: function(state){ return openSurface(state, 'poster'); }
};
