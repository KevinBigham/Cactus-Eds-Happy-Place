<script>

/* =============== MODULE: 00_INDEX.JS =============== */
/* ================================================================
   MODULE: 00_INDEX
   Global CEHP namespace root. First concatenated file.
   Nothing else may declare `var CEHP`.
   ---------------------------------------------------------------- */

var CEHP = CEHP || {};

(function(ns){
  'use strict';

  ns.VERSION  = '0.2.0-rebuild';
  ns.RULESET  = 'R2';
  ns.BUILD_AT = '2026-04-20';

  ns._modules = {};
  ns._register = function(key){ ns._modules[key] = true; };
  ns._loaded   = function(){
    var out = [];
    for (var k in ns._modules) {
      if (Object.prototype.hasOwnProperty.call(ns._modules, k)) out.push(k);
    }
    return out.sort();
  };
})(CEHP);
CEHP._register('00_index');
if (typeof console !== 'undefined') {
  console.log('[CEHP] ' + CEHP.VERSION + ' ' + CEHP.RULESET + ' — counterfeit-educational.org');
}


/* =============== MODULE: 01_CONST.JS =============== */
/* ================================================================
   MODULE: 01_CONST
   Tuning values, save keys, ruleset id. Changing tuning mid-ruleset
   breaks Case Seed replay parity — bump RULESET when tuning shifts.
   ---------------------------------------------------------------- */

(function(ns){
  'use strict';

  ns.K = {
    SAVE_V1:     'cactusEd_save_v1',  /* sacred — legacy contract */
    SAVE_V2:     'cactusEd_save_v2',  /* live in rebuild */
    TITLE_SEEN:  'cactusEd_title_seen_v1',
    DOCKET_WEEK: 'cactusEd_docket_week_v1'
  };

  ns.GAME_W = 512;
  ns.GAME_H = 448;

  ns.TUNING = {
    GRAVITY:            900,
    RUN_SPEED:          180,
    JUMP_VELOCITY:     -340,
    DOUBLE_JUMP:       -300,
    TRIPLE_JUMP:       -260,
    COYOTE_MS:          100,
    JUMP_BUFFER_MS:     120,
    CORNER_NUDGE_PX:      4,
    DEATH_STAMP_MS:     200,
    DEATH_ESCALATE_N:     3,
    DEATH_ESCALATE_MS:10000,
    TEMPO_BPM_BASE:      60,
    TEMPO_BPM_RASTA:     72,
    RECEIPT_FRAG_TARGET:180
  };

  ns.AXIS_NAMES = ['compliance','intuition','curiosity','grace','chaos','efficiency'];
})(CEHP);
CEHP._register('01_const');


/* =============== MODULE: 02_RNG.JS =============== */
/* ================================================================
   MODULE: 02_RNG
   Seeded Linear Congruential Generator. NEVER Math.random().
   Determinism is sacred — same seed must produce same sequence.
   ---------------------------------------------------------------- */

(function(ns){
  'use strict';

  var MULT = 1664525;
  var INCR = 1013904223;
  var MOD  = 4294967296; /* 2^32 */

  function RNG(seed){ this._s = (seed >>> 0); }

  RNG.prototype.next  = function(){
    this._s = ((this._s * MULT) + INCR) >>> 0;
    return this._s;
  };
  RNG.prototype.float = function(){ return this.next() / MOD; };
  RNG.prototype.int   = function(min, max){
    /* inclusive min, exclusive max */
    return min + (this.next() % (max - min));
  };
  RNG.prototype.pick   = function(arr){ return arr[this.int(0, arr.length)]; };
  RNG.prototype.chance = function(p){ return this.float() < p; };
  RNG.prototype.getState = function(){ return this._s; };
  RNG.prototype.setState = function(s){ this._s = s >>> 0; };

  /* Stable 32-bit hash of an arbitrary string (FNV-1a) */
  function seedFromString(str){
    var h = 2166136261 >>> 0;
    for (var i = 0; i < str.length; i++) {
      h ^= str.charCodeAt(i);
      h = (h * 16777619) >>> 0;
    }
    return h;
  }

  ns.RNG            = RNG;
  ns.seedFromString = seedFromString;
  ns.makeRNG        = function(seed){
    if (typeof seed === 'string') return new RNG(seedFromString(seed));
    return new RNG(seed | 0);
  };
})(CEHP);
CEHP._register('02_rng');


/* =============== MODULE: 03_EVENTS.JS =============== */
/* ================================================================
   MODULE: 03_EVENTS
   Tiny synchronous pub/sub. Topic keys are strings. Handlers fire
   in subscription order. Errors are caught so one bad handler
   never takes down the bus.
   ---------------------------------------------------------------- */

(function(ns){
  'use strict';

  var topics = {};

  function on(topic, fn){
    if (!topics[topic]) topics[topic] = [];
    topics[topic].push(fn);
    return function off(){
      var list = topics[topic];
      if (!list) return;
      for (var i = 0; i < list.length; i++) {
        if (list[i] === fn) { list.splice(i, 1); return; }
      }
    };
  }

  function emit(topic, payload){
    var list = topics[topic];
    if (!list) return;
    var snap = list.slice();
    for (var i = 0; i < snap.length; i++) {
      try { snap[i](payload); }
      catch (e) {
        if (typeof console !== 'undefined') console.error('[Events] ' + topic, e);
      }
    }
  }

  function clear(){ topics = {}; }

  ns.Events = { on: on, emit: emit, clear: clear };
})(CEHP);
CEHP._register('03_events');


/* =============== MODULE: 04_SAVE.JS =============== */
/* ================================================================
   MODULE: 04_SAVE
   Save contract. v2 is the live schema; v1 blobs are preserved
   verbatim under the archaeological `legacy` field so future
   receipts can say "PREVIOUS INCIDENT ON FILE. DATED."
   The v1 key itself is also retained after migration — never
   silently deleted. Sacred: cactusEd_save_v1 must still parse.
   ---------------------------------------------------------------- */

(function(ns){
  'use strict';

  var K_V1 = ns.K.SAVE_V1;
  var K_V2 = ns.K.SAVE_V2;
  var VERSION = 2;

  function emptyV2(){
    return {
      version: VERSION,
      ruleset: ns.RULESET,
      ts: 0,
      world: 1, health: 3, aloe: 0,
      deaths: 0, runs: 0, bestTime: 0, totalKills: 0,
      axes: { compliance:0, intuition:0, curiosity:0, grace:0, chaos:0, efficiency:0 },
      micro: {},
      cases: [],
      assistMode: {
        biggerCoyote:false, slowerBosses:false, easyCopter:false,
        infiniteHealth:false, slowerGame:false,
        reduceFlash:false, reduceShake:false, reduceParticles:false
      },
      legacy: null
    };
  }

  function readRaw(key){
    try {
      var raw = localStorage.getItem(key);
      if (raw == null) return null;
      return JSON.parse(raw);
    } catch (e) { return null; }
  }

  function writeRaw(key, obj){
    try {
      localStorage.setItem(key, JSON.stringify(obj));
      return true;
    } catch (e) { return false; }
  }

  function migrate(v1){
    var v2 = emptyV2();
    v2.ts         = (v1 && v1.timestamp) || Date.now();
    v2.world      = (v1 && v1.world)      || 1;
    v2.health     = (v1 && v1.health) != null ? v1.health : 3;
    v2.aloe       = (v1 && v1.aloe)       || 0;
    v2.deaths     = (v1 && v1.deaths)     || 0;
    v2.runs       = (v1 && v1.runs)       || 0;
    v2.bestTime   = (v1 && v1.bestTime)   || 0;
    v2.totalKills = (v1 && v1.totalKills) || 0;
    if (v1 && v1.behavior) {
      var src = v1.behavior;
      for (var i = 0; i < ns.AXIS_NAMES.length; i++) {
        var a = ns.AXIS_NAMES[i];
        if (typeof src[a] === 'number') v2.axes[a] = src[a];
      }
    }
    if (v1 && v1.assistMode) {
      for (var k in v1.assistMode) {
        if (Object.prototype.hasOwnProperty.call(v1.assistMode, k)) {
          v2.assistMode[k] = v1.assistMode[k];
        }
      }
    }
    /* Archaeological layer — frozen copy of the v1 blob, verbatim. */
    v2.legacy = v1 ? JSON.parse(JSON.stringify(v1)) : null;
    return v2;
  }

  function boot(){
    var v2 = readRaw(K_V2);
    if (v2 && v2.version === VERSION) return v2;
    var v1 = readRaw(K_V1);
    if (v1) {
      var migrated = migrate(v1);
      writeRaw(K_V2, migrated);
      return migrated;
    }
    return emptyV2();
  }

  function save(payload){
    if (!payload || typeof payload !== 'object') return false;
    if (payload.version !== VERSION) payload.version = VERSION;
    if (!payload.ruleset) payload.ruleset = ns.RULESET;
    payload.ts = Date.now();
    return writeRaw(K_V2, payload);
  }

  function load(){
    var v2 = readRaw(K_V2);
    if (v2 && v2.version === VERSION) return v2;
    return null;
  }

  function clear(){
    try { localStorage.removeItem(K_V2); return true; }
    catch (e) { return false; }
  }

  function exists(){
    try { return localStorage.getItem(K_V2) != null; }
    catch (e) { return false; }
  }

  function hasLegacy(){
    var v2 = readRaw(K_V2);
    return !!(v2 && v2.legacy);
  }

  ns.SAVE = {
    _key:     K_V2,
    _keyV1:   K_V1,
    _version: VERSION,
    boot:     boot,
    save:     save,
    load:     load,
    clear:    clear,
    exists:   exists,
    hasLegacy:hasLegacy,
    _migrate: migrate,
    _emptyV2: emptyV2
  };
})(CEHP);
CEHP._register('04_save');


/* =============== MODULE: 05_CASESEED.JS =============== */
/* ================================================================
   MODULE: 05_CASESEED
   Case Seed format: CASE-YYYYMMDD-NNN-AXIS-R2
   Deterministic. URL-parseable. Every run has exactly one.
   ---------------------------------------------------------------- */

(function(ns){
  'use strict';

  var REGEX = /^CASE-(\d{8})-(\d{3})-([A-Z]+)-(R\d+)$/;

  function pad(n, w){
    var s = String(n);
    while (s.length < w) s = '0' + s;
    return s;
  }

  function dateStamp(d){
    d = d || new Date();
    return '' + d.getUTCFullYear() + pad(d.getUTCMonth() + 1, 2) + pad(d.getUTCDate(), 2);
  }

  function make(opts){
    opts = opts || {};
    var d    = opts.date    || new Date();
    var n    = opts.counter != null ? opts.counter : 0;
    var axis = (opts.axis   || 'CURIOSITY').toUpperCase();
    var rs   = opts.ruleset || ns.RULESET || 'R2';
    return 'CASE-' + dateStamp(d) + '-' + pad(n, 3) + '-' + axis + '-' + rs;
  }

  function parse(seedStr){
    if (typeof seedStr !== 'string') return null;
    var m = REGEX.exec(seedStr);
    if (!m) return null;
    return {
      raw:     seedStr,
      date:    m[1],
      counter: parseInt(m[2], 10),
      axis:    m[3],
      ruleset: m[4]
    };
  }

  function isValid(seedStr){ return REGEX.test(seedStr); }

  function fromURL(url){
    url = url || (typeof location !== 'undefined' ? location.search : '');
    var q = url.indexOf('?');
    var query = q >= 0 ? url.slice(q + 1) : url;
    var parts = query.split('&');
    for (var i = 0; i < parts.length; i++) {
      var kv = parts[i].split('=');
      if (kv[0] === 'case') return parse(decodeURIComponent(kv[1] || ''));
    }
    return null;
  }

  ns.CaseSeed = {
    make:    make,
    parse:   parse,
    isValid: isValid,
    fromURL: fromURL,
    REGEX:   REGEX
  };
})(CEHP);
CEHP._register('05_caseseed');


/* =============== MODULE: 10_AXES.JS =============== */
/* ================================================================
   MODULE: 10_AXES
   6 primary axes + ~30 micro-signals + 3 derived pairwise tensions.
   Primary axes stay invisible during play. Receipts are the reveal.
   ---------------------------------------------------------------- */

(function(ns){
  'use strict';

  var primary = { compliance:0, intuition:0, curiosity:0, grace:0, chaos:0, efficiency:0 };

  var micro = {
    backtracks:0, idleMs:0, signPeeks:0, nearMisses:0, jumpCount:0,
    kickCount:0, punchCount:0, wallJumps:0, corrections:0,
    contradictionFollow:0, contradictionDefy:0, signsRead:0, signsIgnored:0,
    secretsFound:0, secretsMissed:0, deaths:0, respawns:0, formsUsed:0,
    damageDealt:0, damageTaken:0, hitStreak:0, noHitMs:0, speedrunMs:0,
    revisits:0, restsTaken:0, cigBurnRate:0, ashLength:0, musicSync:0,
    forbiddenTouched:0, modulesPassed:0, modulesSkipped:0
  };

  var bound = false;

  function clamp01(v){ return v < 0 ? 0 : (v > 1 ? 1 : v); }

  function bumpMicro(key, n){
    if (!Object.prototype.hasOwnProperty.call(micro, key)) return;
    micro[key] += n == null ? 1 : n;
  }

  function set(axis, v){
    if (Object.prototype.hasOwnProperty.call(primary, axis)) primary[axis] = clamp01(v);
  }
  function bump(axis, delta){
    if (Object.prototype.hasOwnProperty.call(primary, axis)) primary[axis] = clamp01(primary[axis] + delta);
  }
  function get(axis){
    return Object.prototype.hasOwnProperty.call(primary, axis) ? primary[axis] : 0;
  }

  function snapshot(){
    return JSON.parse(JSON.stringify({ primary: primary, micro: micro }));
  }

  function tensions(){
    return {
      obedience: primary.compliance - primary.chaos,
      style:     primary.grace + primary.efficiency,
      auditRisk: primary.curiosity - primary.intuition
    };
  }

  function dominant(){
    var best = null, score = -Infinity;
    for (var k in primary) {
      if (!Object.prototype.hasOwnProperty.call(primary, k)) continue;
      if (primary[k] > score) { score = primary[k]; best = k; }
    }
    return best;
  }

  function reset(){
    for (var k in primary) primary[k] = 0;
    for (var m in micro)   micro[m]   = 0;
  }

  function bind(topic, fn){
    if (!ns.Events || !ns.Events.on) return;
    ns.Events.on(topic, fn);
  }

  function bindEvents(){
    if (bound || !ns.Events || !ns.Events.on) return;
    bound = true;

    bind('sign:peek', function(payload){
      bumpMicro('signPeeks', 1);
      bump('curiosity', 0.02);
      bump('intuition', 0.01);
      if (payload && payload.words > 6) bump('curiosity', 0.01);
    });

    bind('sign:read', function(payload){
      bumpMicro('signsRead', 1);
      bump('curiosity', 0.04);
      bump('compliance', 0.02);
      if (payload && payload.defiant) bump('chaos', 0.01);
    });

    bind('movement:jump', function(){
      bumpMicro('jumpCount', 1);
      bump('grace', 0.02);
    });

    bind('movement:doubleJump', function(){
      bumpMicro('jumpCount', 1);
      bump('grace', 0.03);
      bump('chaos', 0.005);
    });

    bind('movement:tripleJump', function(){
      bumpMicro('jumpCount', 1);
      bump('grace', 0.035);
      bump('chaos', 0.01);
    });

    bind('movement:wallJump', function(){
      bumpMicro('wallJumps', 1);
      bump('grace', 0.04);
    });

    bind('movement:punch', function(){
      bumpMicro('punchCount', 1);
      bump('chaos', 0.02);
    });

    bind('movement:kick', function(){
      bumpMicro('kickCount', 1);
      bump('chaos', 0.03);
      bump('efficiency', 0.01);
    });

    bind('movement:spinDash', function(payload){
      bump('efficiency', 0.04);
      bump('chaos', 0.015);
      if (payload && payload.tier > 1) bump('grace', 0.01);
    });

    bind('movement:cigCopter', function(){
      bump('intuition', 0.025);
      bump('grace', 0.01);
    });

    bind('movement:groundSlam', function(){
      bump('chaos', 0.035);
    });

    bind('movement:glide', function(){
      bump('grace', 0.03);
      bump('intuition', 0.01);
    });

    bind('movement:idle', function(payload){
      var dt = payload && payload.dtMs ? payload.dtMs : 0;
      bumpMicro('idleMs', dt);
      bump('compliance', 0.015);
    });

    bind('movement:backtrack', function(payload){
      bumpMicro('backtracks', 1);
      if (payload && payload.distance) bump('curiosity', Math.min(0.05, payload.distance / 1000));
      else bump('curiosity', 0.02);
    });

    bind('movement:nearMiss', function(){
      bumpMicro('nearMisses', 1);
      bump('grace', 0.03);
    });

    bind('movement:correction', function(payload){
      bumpMicro('corrections', 1);
      bump('grace', 0.02);
      if (payload && payload.distance) bump('efficiency', 0.005);
    });

    bind('contradiction:follow', function(){
      bumpMicro('contradictionFollow', 1);
      bump('compliance', 0.05);
      bump('efficiency', 0.02);
    });

    bind('contradiction:defy', function(){
      bumpMicro('contradictionDefy', 1);
      bump('chaos', 0.06);
      bump('curiosity', 0.03);
    });

    bind('form:used', function(){
      bumpMicro('formsUsed', 1);
      bump('efficiency', 0.02);
    });

    bind('secret:found', function(){
      bumpMicro('secretsFound', 1);
      bump('curiosity', 0.04);
      bump('intuition', 0.02);
    });

    bind('secret:missed', function(){
      bumpMicro('secretsMissed', 1);
      bump('compliance', 0.01);
    });

    bind('combat:damageDealt', function(payload){
      bumpMicro('damageDealt', payload && payload.amount ? payload.amount : 1);
      bump('chaos', 0.02);
    });

    bind('combat:damageTaken', function(payload){
      bumpMicro('damageTaken', payload && payload.amount ? payload.amount : 1);
      bump('intuition', 0.02);
    });

    bind('player:death', function(){
      bumpMicro('deaths', 1);
      bump('intuition', 0.02);
    });

    bind('player:respawn', function(){
      bumpMicro('respawns', 1);
    });

    bind('run:complete', function(){
      bumpMicro('modulesPassed', 1);
      bump('efficiency', 0.03);
    });

    bind('module:passed', function(){
      bumpMicro('modulesPassed', 1);
      bump('compliance', 0.015);
      bump('efficiency', 0.01);
    });

    bind('run:skipped', function(){
      bumpMicro('modulesSkipped', 1);
      bump('chaos', 0.02);
    });

    bind('module:skipped', function(){
      bumpMicro('modulesSkipped', 1);
      bump('chaos', 0.01);
    });

    bind('music:sync', function(){
      bumpMicro('musicSync', 1);
      bump('grace', 0.015);
    });

    bind('cig:burn', function(payload){
      micro.cigBurnRate = payload && payload.rate ? payload.rate : 0;
    });

    bind('cig:ash', function(payload){
      micro.ashLength = payload && payload.length ? payload.length : 0;
    });
  }

  bindEvents();

  ns.Axes = {
    primary:  primary,
    micro:    micro,
    set:      set,
    bump:     bump,
    get:      get,
    bindEvents: bindEvents,
    snapshot: snapshot,
    tensions: tensions,
    dominant: dominant,
    reset:    reset
  };
})(CEHP);
CEHP._register('10_axes');


/* =============== MODULE: 11_METRICS.JS =============== */
/* ================================================================
   MODULE: 11_METRICS
   Recency-weighted micro-signal tracking. Feeds receipt text
   selection; never surfaced to the player.
   ---------------------------------------------------------------- */

(function(ns){
  'use strict';

  var WINDOW_MS = 8000;
  var IDLE_BUCKET_MS = 400;
  var BACKTRACK_PX = 12;
  var state = null;
  var bound = false;

  function freshState(){
    return {
      timeMs: 0,
      idleMs: 0,
      idleBuckets: 0,
      lastX: null,
      lastY: null,
      lastFacing: 1,
      totals: {},
      recent: []
    };
  }

  function reset(){
    state = freshState();
  }

  function trim(){
    var cutoff = state.timeMs - WINDOW_MS;
    while (state.recent.length && state.recent[0].t < cutoff) {
      state.recent.shift();
    }
  }

  function pushRecent(key, amount, payload){
    state.recent.push({
      key: key,
      amount: amount,
      payload: payload || null,
      t: state.timeMs
    });
    trim();
  }

  function record(signalKey, n, payload){
    var amount = n == null ? 1 : n;
    state.totals[signalKey] = (state.totals[signalKey] || 0) + amount;
    pushRecent(signalKey, amount, payload);
    return state.totals[signalKey];

          ashLength: ashLength,

/* =============== MODULE: 51_CONTRADICTION.JS =============== */
/* ================================================================
   MODULE: 51_CONTRADICTION
   Core mechanic: same sign, different behavior → different route.
     `DO NOT JUMP` — jumping opens lower path; waiting opens upper.
   Receipts: INSUBORDINATION NOTED / PATIENCE REWARDED.
   ---------------------------------------------------------------- */

(function(ns){
  'use strict';

  function gate(config){
    config = config || {};

    var out = {
      sign: config.sign || null,
      expectedBehavior: config.expectedBehavior || 'wait',
      windowMs: config.windowMs || config.window || 800,
      onFollow: typeof config.onFollow === 'function' ? config.onFollow : function(){},
      onDefy: typeof config.onDefy === 'function' ? config.onDefy : function(){},
      resolved: false,
      outcome: null,
      routeResult: null,
      evaluate: function(payload){
        payload = payload || {};
        if (out.resolved) return out.outcome;

        var action = payload.action || '';
        var elapsedMs = payload.elapsedMs || 0;
        var expected = out.expectedBehavior;

        if (action && action !== expected && elapsedMs <= out.windowMs) {
          out.outcome = 'defy';
          out.resolved = true;
          out.routeResult = out.onDefy(payload);
          if (ns.Events && ns.Events.emit) {
            ns.Events.emit('contradiction:defy', { gateId: out.sign && out.sign.id, action: action, elapsedMs: elapsedMs });
          }
          return out.outcome;
        }

        if (expected !== 'wait' && action === expected) {
          out.outcome = 'follow';
          out.resolved = true;
          out.routeResult = out.onFollow(payload);
          if (ns.Events && ns.Events.emit) {
            ns.Events.emit('contradiction:follow', { gateId: out.sign && out.sign.id, action: action, elapsedMs: elapsedMs });
          }
          return out.outcome;
        }

        if (expected === 'wait' && elapsedMs >= out.windowMs) {
          out.outcome = 'follow';
          out.resolved = true;
          out.routeResult = out.onFollow(payload);
          if (ns.Events && ns.Events.emit) {
            ns.Events.emit('contradiction:follow', { gateId: out.sign && out.sign.id, action: 'wait', elapsedMs: elapsedMs });
          }
          return out.outcome;
        }

        return 'pending';
      }
    };

    return out;
  }

    gate: gate
  };
})(CEHP);

/* =============== MODULE: 74_WORLD_ORIENTATION_RUNTIME.JS =============== */
/* ================================================================
   MODULE: 74_WORLD_ORIENTATION_RUNTIME
   Week 2 playable world. Six-room orientation slice that replaces
   the Week 1 test room as the default boot target.
   ---------------------------------------------------------------- */

(function(ns){
  'use strict';

  function staticRect(scene, x, y, w, h, color, alpha, depth){
    var rect = scene.add.rectangle(x, y, w, h, color || 0x44546a, alpha == null ? 1 : alpha).setDepth(depth == null ? 4 : depth);
    scene.physics.add.existing(rect, true);
    rect.body.allowGravity = false;
    rect.body.updateFromGameObject();
    return rect;
  }

  function sensorZone(scene, x, y, w, h){
    var zone = scene.add.zone(x, y, w, h).setDepth(3);
    scene.physics.add.existing(zone, true);
    zone.body.allowGravity = false;
    zone.body.moves = false;
    return zone;
  }

  function textLabel(scene, x, y, text, size, color, depth){
    return scene.add.text(x, y, text, {
      fontFamily: 'monospace',
      fontSize: (size || 8) + 'px',
      color: color || '#dfe6ef',
      align: 'left'
    }).setDepth(depth == null ? 8 : depth);
  }

  function applicantSilhouette(scene, x, y, variant){
    var g = scene.add.graphics().setDepth(3);
    var ink = 0x263246;
    var accent = 0x5f748f;
    g.fillStyle(ink, 0.84);
    g.fillCircle(x, y - 54, 12);
    if (variant === 1) {
      g.fillRect(x - 18, y - 38, 36, 58);
      g.fillStyle(accent, 0.32);
      g.fillRect(x + 10, y - 26, 14, 30);
      g.fillStyle(ink, 0.84);
      g.fillRect(x - 26, y - 14, 10, 34);
      g.fillRect(x + 16, y - 14, 10, 34);
    } else if (variant === 2) {
      g.beginPath();
      g.moveTo(x - 22, y - 34);
      g.lineTo(x + 16, y - 34);
      g.lineTo(x + 28, y + 18);
      g.lineTo(x - 28, y + 18);
      g.closePath();
      g.fillPath();
      g.fillStyle(accent, 0.32);
      g.fillRect(x - 32, y - 8, 12, 28);
      g.fillStyle(ink, 0.84);
      g.fillRect(x - 18, y + 18, 10, 34);
      g.fillRect(x + 8, y + 18, 10, 34);
    } else {
      g.beginPath();
      g.moveTo(x - 24, y - 34);
      g.lineTo(x + 24, y - 34);
      g.lineTo(x + 18, y + 22);
      g.lineTo(x - 18, y + 22);
      g.closePath();
      g.fillPath();
      g.fillStyle(accent, 0.32);
      g.fillRect(x - 34, y - 18, 12, 34);
      g.fillStyle(ink, 0.84);
      g.fillRect(x - 14, y + 22, 10, 30);
      g.fillRect(x + 4, y + 22, 10, 30);
    }
    return g;
  }

  function placeApplicants(world, room, specs){
    var i;
    for (i = 0; i < specs.length; i++) {
      applicantSilhouette(world.scene, specs[i].x, specs[i].y, specs[i].variant);
    }
  }

  function destroyThing(obj){
    if (obj && obj.destroy) obj.destroy();
  }

  function clone(obj){
    return JSON.parse(JSON.stringify(obj));
  }

  function containsPoint(area, x, y){
    if (!area) return false;
    return x >= (area.x - (area.width / 2)) &&
      x <= (area.x + (area.width / 2)) &&
      y >= (area.y - (area.height / 2)) &&
      y <= (area.y + (area.height / 2));
  }

  function intersects(player, area){
    return ns.Collision && ns.Collision.intersects ? ns.Collision.intersects(player, area) : false;
  }

  function rememberRoom(world, roomId){
    if (world.visitedRooms[roomId]) return;
    world.visitedRooms[roomId] = true;
    world.roomOrder.push(roomId);
  }

  function learnAction(world, actionName){
    if (!actionName || world.learnedMap[actionName]) return;
    world.learnedMap[actionName] = true;
    world.actionsLearned.push(actionName);
    world.actionsLearned.sort(function(a, b){
      var list = ns.Movement && ns.Movement.ACTIONS ? ns.Movement.ACTIONS : [];
      return list.indexOf(a) - list.indexOf(b);
    });
  }

  function markModule(world, room, moduleId){
    if (world.completedModules[moduleId]) return;
    world.completedModules[moduleId] = true;
    if (ns.Events && ns.Events.emit) ns.Events.emit('module:passed', {
      roomId: room.id,
      moduleId: moduleId
    });
  }

  function readSign(world, sign){
    if (!sign || !world.player || !sign.sensor) return;
    if (intersects(world.player, sign.sensor)) {
      sign.peek({ signId: sign.id, words: sign.text.split(/\s+/).length });
      if (ns.Input.justPressed('up')) {
        sign.read({ signId: sign.id, words: sign.text.split(/\s+/).length });
      }
    }
  }

  function trimActions(world){
    var now = world.scene.time.now;
    var keep = [];
    for (var i = 0; i < world.actionQueue.length; i++) {
      if ((now - world.actionQueue[i].at) <= 320) keep.push(world.actionQueue[i]);
    }
    world.actionQueue = keep;
  }

  function consumeAction(world, actionName, area){
    for (var i = 0; i < world.actionQueue.length; i++) {
      var item = world.actionQueue[i];
      var px = item.payload && item.payload.x != null ? item.payload.x : world.player.x;
      var py = item.payload && item.payload.y != null ? item.payload.y : world.player.y;
      if (item.action !== actionName) continue;
      if (area && !containsPoint(area, px, py)) continue;
      world.actionQueue.splice(i, 1);
      return true;
    }
    return false;
  }

  function addPlatform(world, room, x, y, w, h, color, alpha, depth){
    var rect = staticRect(world.scene, x, y, w, h, color, alpha, depth);
    world.platforms.push(rect);
    room.platforms.push(rect);
    return rect;
  }

  function addBackdrop(world, room, color, accent){
    var width = room.endX - room.startX;
    world.scene.add.rectangle(room.startX + (width / 2), ns.GAME_H / 2, width - 24, ns.GAME_H - 32, color, 1).setDepth(0);
    world.scene.add.rectangle(room.startX + 18, ns.GAME_H / 2, 16, ns.GAME_H - 32, accent, 1).setDepth(1);
    textLabel(world.scene, room.startX + 34, 22, room.title, 8, '#e8e3d1', 8);
  }

  function makeRoom(world, spec, startX, width){
    var room = {
      id: spec.id,
      title: spec.title,
      startX: startX,
      endX: startX + width,
      platforms: [],
      modules: [],
      contradictions: [],
      contradictionOutcome: '',
      completeX: startX + width - 88
    };
    world.rooms.push(room);
    return room;
  }

  function makeActionGate(world, room, cfg){
    var scene = world.scene;
    var sign = ns.Signs.place(scene, cfg.signX, cfg.signY, cfg.text, { id: cfg.id + '-sign' });
    var sensor = sensorZone(scene, cfg.sensorX, cfg.sensorY, cfg.sensorW || 100, cfg.sensorH || 70);
    var blocker = cfg.blocker ? staticRect(scene, cfg.blocker.x, cfg.blocker.y, cfg.blocker.w, cfg.blocker.h, cfg.blocker.color || 0xc23b3b, 1, 6) : null;
    var lamp = scene.add.rectangle(cfg.signX + 62, cfg.signY - 8, 10, 10, 0x6c7078, 1).setDepth(11);
    var gate = {
      id: cfg.id,
      actionName: cfg.actionName,
      sign: sign,
      sensor: sensor,
      blocker: blocker,
      lamp: lamp,
      resolved: false,
      note: cfg.note || '',
      onResolve: cfg.onResolve || null,
      resolve: function(reason){
        if (gate.resolved) return;
        gate.resolved = true;
        destroyThing(gate.blocker);
        gate.lamp.fillColor = 0x5b8f6a;
        learnAction(world, gate.actionName);
        markModule(world, room, gate.id);
        if (gate.onResolve) gate.onResolve(reason || 'live', gate);
      }
    };

    room.modules.push(gate);
    world.modules.push(gate);
    return gate;
  }

  function makeContradictionFork(world, room, cfg){
    var scene = world.scene;
    var horizon = world.horizon;
    var baseX = cfg.baseX;
    var sign = ns.Signs.place(scene, baseX + 28, horizon - 78, cfg.text, { id: cfg.id + '-sign' });
    var trigger = sensorZone(scene, baseX + 86, horizon - 40, 120, 80);
    var lamp = scene.add.rectangle(baseX + 96, horizon - 94, 10, 10, 0x6c7078, 1).setDepth(11);

    addPlatform(world, room, baseX + 166, horizon - 36, 86, 14, 0x56657b, 1, 4);
    addPlatform(world, room, baseX + 236, horizon - 68, 86, 14, 0x56657b, 1, 4);
    addPlatform(world, room, baseX + 306, horizon - 100, 86, 14, 0x56657b, 1, 4);
    addPlatform(world, room, baseX + 470, horizon - 116, 260, 18, 0x6a7890, 1, 4);

    var upperDoor = staticRect(scene, baseX + 564, horizon - 145, 18, 60, 0xc23b3b, 1, 6);
    var lowerDoor = staticRect(scene, baseX + 564, horizon - 30, 18, 60, 0xc23b3b, 1, 6);

    var fork = {
      id: cfg.id,
      sign: sign,
      trigger: trigger,
      lamp: lamp,
      upperDoor: upperDoor,
      lowerDoor: lowerDoor,
      defyAction: cfg.defyAction || 'move',
      enteredAt: 0,
      applied: false,
      gate: ns.Contradiction.gate({
        sign: { id: sign.id },
        expectedBehavior: 'wait',
        windowMs: cfg.windowMs || 900,
        onFollow: function(){ return 'upper'; },
        onDefy: function(){ return 'lower'; }
      }),
      applyOutcome: function(){
        if (fork.applied || !fork.gate.resolved) return;
        fork.applied = true;
        room.contradictionOutcome = fork.gate.outcome || '';
        world.lastContradictionOutcome = room.contradictionOutcome;
        if (fork.gate.outcome === 'follow') {
          destroyThing(fork.upperDoor);
          fork.lamp.fillColor = 0x5b8f6a;
        } else {
          destroyThing(fork.lowerDoor);
          fork.lamp.fillColor = 0xe04a3a;
        }
      },
      follow: function(){
        fork.gate.evaluate({ action: 'wait', elapsedMs: (cfg.windowMs || 900) + 20 });
        fork.applyOutcome();
      },
      defy: function(){
        fork.gate.evaluate({ action: fork.defyAction, elapsedMs: 120 });
        fork.applyOutcome();
      }
    };

    room.contradictions.push(fork);
    world.contradictions.push(fork);
    return fork;
  }

  function gateCondition(world, gate){
    if (!intersects(world.player, gate.sensor)) return false;
    switch (gate.actionName) {
      case 'move':
        return Math.abs(world.player.body.velocity.x) > 20;
      case 'jump':
        return consumeAction(world, 'jump', gate.sensor);
      case 'doubleJump':
        return consumeAction(world, 'doubleJump', gate.sensor);
      case 'tripleJump':
        return consumeAction(world, 'tripleJump', gate.sensor);
      case 'wallSlideJump':
        return consumeAction(world, 'wallSlideJump', gate.sensor);
      case 'punch':
        return consumeAction(world, 'punch', gate.sensor);
      case 'kick':
        return consumeAction(world, 'kick', gate.sensor);
      case 'spinDash':
        return consumeAction(world, 'spinDash', gate.sensor);
      case 'cigCopter':
        return consumeAction(world, 'cigCopter', gate.sensor);
      case 'groundSlam':
        return consumeAction(world, 'groundSlam', gate.sensor);
      case 'glide':
        return consumeAction(world, 'glide', gate.sensor);
      default:
        return false;
    }
  }

  function syncCurrentRoom(world){
    var x = world.player.x;
    for (var i = 0; i < world.rooms.length; i++) {
      if (x >= world.rooms[i].startX && x < world.rooms[i].endX) {
        world.currentRoomId = world.rooms[i].id;
        world.runState.roomId = world.rooms[i].id;
        rememberRoom(world, world.rooms[i].id);
        return;
      }
    }
    if (world.rooms.length) {
      world.currentRoomId = world.rooms[world.rooms.length - 1].id;
      world.runState.roomId = world.currentRoomId;
    }
  }

  function updateContradictions(world, time){
    var player = world.player;
    for (var i = 0; i < world.contradictions.length; i++) {
      var fork = world.contradictions[i];
      readSign(world, fork.sign);
      if (fork.applied) continue;
      if (!intersects(player, fork.trigger)) {
        fork.enteredAt = 0;
        continue;
      }
      if (!fork.enteredAt) fork.enteredAt = time;

      var action = '';
      if (fork.defyAction === 'move') {
        if (Math.abs(player.body.velocity.x) > 18) action = 'move';
      } else if (consumeAction(world, fork.defyAction, fork.trigger)) {
        action = fork.defyAction;
      }

      fork.gate.evaluate({
        action: action,
        elapsedMs: time - fork.enteredAt
      });
      fork.applyOutcome();
    }
  }

  function updateModules(world){
    for (var i = 0; i < world.modules.length; i++) {
      readSign(world, world.modules[i].sign);
      if (world.modules[i].resolved) continue;
      if (gateCondition(world, world.modules[i])) world.modules[i].resolve('live');
    }
  }

  function unlockFinalDoor(world){
    if (world.finalDoorUnlocked) return;
    if (world.actionsLearned.length < ns.Movement.ACTIONS.length) return;
    world.finalDoorUnlocked = true;
    destroyThing(world.finalDoor);
    world.finalLamp.fillColor = 0x5b8f6a;
  }

  function queueAction(world, action, payload){
    world.actionQueue.push({
      action: action,
      payload: payload || {},
      at: world.scene.time.now
    });
  }

  function bindActionQueue(world){
    var topics = [
      ['movement:jump', 'jump'],
      ['movement:doubleJump', 'doubleJump'],
      ['movement:tripleJump', 'tripleJump'],
      ['movement:wallJump', 'wallSlideJump'],
      ['movement:punch', 'punch'],
      ['movement:kick', 'kick'],
      ['movement:spinDash', 'spinDash'],
      ['movement:cigCopter', 'cigCopter'],
      ['movement:groundSlam', 'groundSlam'],
      ['movement:glide', 'glide']
    ];
    for (var i = 0; i < topics.length; i++) {
      (function(topic, actionName){
        world.offFns.push(ns.Events.on(topic, function(payload){
          queueAction(world, actionName, payload);
        }));
      })(topics[i][0], topics[i][1]);
    }
  }

  function buildIntake(world, spec, startX, width){
    var room = makeRoom(world, spec, startX, width);
    addBackdrop(world, room, 0x172238, 0x3a5ca8);
    placeApplicants(world, room, [
      { x: startX + 188, y: world.horizon - 8, variant: 0 },
      { x: startX + 842, y: world.horizon - 8, variant: 1 }
    ]);
    addPlatform(world, room, startX + 180, world.horizon, width - 80, 28, 0x44546a, 1, 2);
    makeActionGate(world, room, {
      id: 'intake-move',
      actionName: 'move',
      text: spec.actionSigns[0],
      signX: startX + 120,
      signY: world.horizon - 78,
      sensorX: startX + 190,
      sensorY: world.horizon - 24,
      blocker: { x: startX + 254, y: world.horizon - 32, w: 18, h: 66 }
    });
    makeContradictionFork(world, room, {
      id: 'intake-badge',
      baseX: startX + 330,
      text: spec.contradictionSign,
      defyAction: 'move',
      windowMs: 850
    });
    makeActionGate(world, room, {
      id: 'intake-jump',
      actionName: 'jump',
      text: spec.actionSigns[1],
      signX: startX + 968,
      signY: world.horizon - 78,
      sensorX: startX + 1030,
      sensorY: world.horizon - 38,
      blocker: { x: startX + 1102, y: world.horizon - 32, w: 18, h: 66 }
    });
    return room;
  }

  function buildBase(world, spec, startX, width){
    var room = makeRoom(world, spec, startX, width);
    addBackdrop(world, room, 0x141e30, 0x52657a);
    placeApplicants(world, room, [
      { x: startX + 218, y: world.horizon - 8, variant: 2 },
      { x: startX + 918, y: world.horizon - 8, variant: 0 }
    ]);
    addPlatform(world, room, startX + 180, world.horizon, width - 80, 28, 0x44546a, 1, 2);
    makeContradictionFork(world, room, {
      id: 'base-turnstile',
      baseX: startX + 80,
      text: spec.contradictionSign,
      defyAction: 'move',
      windowMs: 860
    });

    room.bridge = ns.Forms.bridge(world.scene, { x: startX + 650, y: world.horizon - 10, width: 132, height: 14 });
    world.platforms.push(room.bridge.rect);
    room.platforms.push(room.bridge.rect);

    makeActionGate(world, room, {
      id: 'base-kick',
      actionName: 'kick',
      text: spec.actionSigns[0],
      signX: startX + 620,
      signY: world.horizon - 80,
      sensorX: startX + 690,
      sensorY: world.horizon - 28,
      blocker: { x: startX + 766, y: world.horizon - 32, w: 18, h: 66 }
    });

    makeActionGate(world, room, {
      id: 'base-spin',
      actionName: 'spinDash',
      text: spec.actionSigns[1],
      signX: startX + 936,
      signY: world.horizon - 80,
      sensorX: startX + 1040,
      sensorY: world.horizon - 28,
      sensorW: 170,
      blocker: { x: startX + 1166, y: world.horizon - 32, w: 18, h: 66 }
    });

    return room;
  }

  function buildVertical(world, spec, startX, width){
    var room = makeRoom(world, spec, startX, width);
    addBackdrop(world, room, 0x162232, 0x88aacc);
    placeApplicants(world, room, [
      { x: startX + 342, y: world.horizon - 8, variant: 1 },
      { x: startX + 1546, y: world.horizon - 104, variant: 2 }
    ]);
    addPlatform(world, room, startX + 300, world.horizon, 560, 28, 0x44546a, 1, 2);
    addPlatform(world, room, startX + 760, world.horizon, 360, 28, 0x44546a, 1, 2);
    addPlatform(world, room, startX + 940, world.horizon - 96, 110, 18, 0x60728a, 1, 4);
    addPlatform(world, room, startX + 1120, world.horizon - 148, 110, 18, 0x60728a, 1, 4);
    addPlatform(world, room, startX + 1300, world.horizon - 196, 140, 18, 0x60728a, 1, 4);

  function emitAction(actionName, payload){

      case 'doubleJump':
        ns.Events.emit('movement:doubleJump', payload);

      case 'wallSlideJump':

      case 'kick':

      case 'spinDash':
        ns.Events.emit('movement:spinDash', payload);
        return;
      case 'cigCopter':
        ns.Events.emit('movement:cigCopter', payload);
        return;
      case 'groundSlam':
        ns.Events.emit('movement:groundSlam', payload);
        return;
      case 'glide':
        ns.Events.emit('movement:glide', payload);

  function actionPayload(room, index, style){
    var biasY = style === 'obedient' ? worldYForStyle(room, 'upper') : worldYForStyle(room, 'lower');

      y: biasY

  }

  function worldYForStyle(room, lane){
    if (room.id === 'vertical-compliance') {
      return lane === 'upper' ? 238 : 330;
    }
    if (room.id === 'aerial-exception') {
      return lane === 'upper' ? 248 : 346;
    }
    return lane === 'upper' ? 276 : 392;

  function scriptRoom(world, room, style, recorderMs){
    var lane = style === 'obedient' ? 'upper' : 'lower';
    var xBase = room.startX + 64;
    world.player.x = xBase;
    world.player.y = worldYForStyle(room, lane);
    syncCurrentRoom(world);
    world.scene.recorder.mark(recorderMs[0], room.startX + 64, worldYForStyle(room, lane), 1);

    if (room.contradictions.length) {
      if (style === 'obedient') room.contradictions[0].follow();
      else room.contradictions[0].defy();
    }

    for (var i = 0; i < room.modules.length; i++) {
      readSign(world, room.modules[i].sign);
      room.modules[i].sign.peek({ signId: room.modules[i].sign.id, words: room.modules[i].sign.text.split(/\s+/).length });
      room.modules[i].sign.read({ signId: room.modules[i].sign.id, words: room.modules[i].sign.text.split(/\s+/).length });
      emitAction(room.modules[i].actionName, actionPayload(room, i, style));
      if (room.modules[i].actionName === 'move') {
        world.player.body.setVelocityX(style === 'obedient' ? 120 : 180);
      }
      room.modules[i].resolve('debug');
      world.scene.recorder.mark(recorderMs[i + 1], room.startX + 220 + (i * 120), worldYForStyle(room, lane), 1);
    }

    if (room.bridge && room.bridge.activate) room.bridge.activate(world.player);
    if (room.trampoline && room.trampoline.activate) room.trampoline.activate(world.player);
    if (room.blade && style === 'defiant' && room.blade.activate) {
      if (ns.Events && ns.Events.emit) ns.Events.emit('movement:nearMiss', { x: room.blade.rect.x, y: room.blade.rect.y });
    }
    if (ns.Events && ns.Events.emit) ns.Events.emit('music:sync', { x: room.endX - 120, y: worldYForStyle(room, lane) });

    world.player.y = worldYForStyle(room, lane);
    syncCurrentRoom(world);

  function runStyle(world, scene, style){

      [420, 560, 720, 880],
      [920, 1180, 1360, 1540, 1720],
      [1760, 1960, 2140, 2320],
      [2360, 2560, 2740, 2920],
      [2960, 3160, 3340]
    ];

    for (var i = 0; i < world.rooms.length; i++) {

  function create(scene, runState){
    var manifest = ns.Worlds && ns.Worlds.get ? ns.Worlds.get('orientation') : null;
    var horizon = ns.GAME_H - 24;

    var sceneWorld = {
      id: 'orientation-world',

      scene: scene,
      runState: runState,

      horizon: horizon,

      modules: [],
      contradictions: [],
      platforms: [],
      actionQueue: [],
      offFns: [],
      visitedRooms: {},
      learnedMap: {},
      completedModules: {},

      actionsLearned: [],
      currentRoomId: 'intake',
      finalDoor: null,
      finalDoorUnlocked: false,
      finalLamp: null,

      lastContradictionOutcome: ''
    };

    scene.cameras.main.setBackgroundColor('#101824');
    scene.physics.world.setBounds(0, 0, sceneWorld.width, ns.GAME_H);
    scene.cameras.main.setBounds(0, 0, sceneWorld.width, ns.GAME_H);

    sceneWorld.player = ns.Movement.createEd(scene, 72, horizon - 28);
    scene.player = sceneWorld.player;

    runState.worldId = 'orientation';
    runState.roomId = 'intake';
    runState.roomOrder = sceneWorld.roomOrder;
    runState.actionsLearned = sceneWorld.actionsLearned;

    buildAerial(sceneWorld, manifest.rooms[4], roomWidth * 4, roomWidth);
    buildFinal(sceneWorld, manifest.rooms[5], roomWidth * 5, roomWidth);

    for (var i = 0; i < sceneWorld.platforms.length; i++) {
      scene.physics.add.collider(sceneWorld.player, sceneWorld.platforms[i], function(player, platform){
        if (sceneWorld.player !== player) return;
        if (sceneWorld.rooms[1].bridge && platform === sceneWorld.rooms[1].bridge.rect) sceneWorld.rooms[1].bridge.activate(player);
        if (sceneWorld.rooms[2].trampoline && platform === sceneWorld.rooms[2].trampoline.rect && player.body.velocity.y >= 0) sceneWorld.rooms[2].trampoline.activate(player);
        if (sceneWorld.rooms[4].trampoline && platform === sceneWorld.rooms[4].trampoline.rect && player.body.velocity.y >= 0) sceneWorld.rooms[4].trampoline.activate(player);
      });
    }

    if (sceneWorld.rooms[3].blade) {
      scene.physics.add.overlap(sceneWorld.player, sceneWorld.rooms[3].blade.rect, function(){
        sceneWorld.rooms[3].blade.activate(sceneWorld.player);
      });
    }

    scene.physics.add.overlap(sceneWorld.player, sceneWorld.goal, function(){
      if (sceneWorld.finalDoorUnlocked) scene.completeRun('goal');
    });

    bindActionQueue(sceneWorld);
    rememberRoom(sceneWorld, 'intake');
    return sceneWorld;

    if (!world || !world.player) return;
    trimActions(world);
    syncCurrentRoom(world);
    updateContradictions(world, scene.time.now);
    updateModules(world);

    for (var i = 0; i < world.offFns.length; i++) {

    }
    world.offFns = [];
  }

(function(ns){
  'use strict';

  function clamp(v, min, max){
    return v < min ? min : (v > max ? max : v);
  }

  function staticRect(scene, x, y, w, h, color, alpha, depth){
    var rect = scene.add.rectangle(x, y, w, h, color || 0x6a6671, alpha == null ? 1 : alpha).setDepth(depth == null ? 4 : depth);
    scene.physics.add.existing(rect, true);
    rect.body.allowGravity = false;

  function sensorZone(scene, x, y, w, h){
    var zone = scene.add.zone(x, y, w, h).setDepth(3);

    zone.body.moves = false;

      fontFamily: 'monospace',
      fontSize: (size || 8) + 'px',
      color: color || '#fff9e0',
      align: 'left'
    }).setDepth(depth == null ? 8 : depth);
  }

  function destroyThing(obj){
    if (obj && obj.destroy) obj.destroy();
  }

  function clone(obj){
    return JSON.parse(JSON.stringify(obj));
  }

    return ns.Collision && ns.Collision.intersects ? ns.Collision.intersects(a, b) : false;
  }

    world.visitedRooms[roomId] = true;
    world.roomOrder.push(roomId);
  }

  function updateRunState(world){
    world.runState.worldStats = world.stats;
    world.runState.receiptFlags = world.receiptFlags;
  }

    world.stats.jumpPenalty = clamp(value, 0, 48);
    world.player.jumpVelocity = clamp(ns.TUNING.JUMP_VELOCITY + world.stats.jumpPenalty, -340, -292);
    updateRunState(world);
  }

  function finalizeRoom(world, room){
    if (!room || room.finalized) return;
    room.finalized = true;
    if (room.safeCompleted) {
      world.stats.premiumRoomsCleared += 1;
      if (!world.receiptFlags.uninsuredVeteran && world.stats.premiumRoomsCleared >= 4) {
        world.receiptFlags.premiumSecured = true;
      }
      updateRunState(world);
    }
  }

  function setRoomRespawn(world, room){
    if (!room || !world.player) return;
    world.player.spawnX = room.startX + 78;
    world.player.spawnY = world.horizon - 34;
  }

  function syncCurrentRoom(world){
    var x = world.player.x;
    for (var i = 0; i < world.rooms.length; i++) {
      if (x >= world.rooms[i].startX && x < world.rooms[i].endX) {
        if (world.currentRoom && world.currentRoom !== world.rooms[i]) finalizeRoom(world, world.currentRoom);
        world.currentRoom = world.rooms[i];
        world.currentRoomId = world.rooms[i].id;
        world.runState.roomId = world.rooms[i].id;
        rememberRoom(world, world.rooms[i].id);
        setRoomRespawn(world, world.rooms[i]);
        return;
      }
    }
    if (world.rooms.length) {
      world.currentRoom = world.rooms[world.rooms.length - 1];
      world.currentRoomId = world.currentRoom.id;
      world.runState.roomId = world.currentRoomId;
    }

    if (!sign || !world.player || !sign.sensor) return;
    if (intersects(world.player, sign.sensor)) {
      sign.peek({ signId: sign.id, words: sign.text.split(/\s+/).length });
      if (ns.Input.justPressed('up')) {

      }
    }

    textLabel(world.scene, room.startX + 34, 22, room.title, 8, '#fff9e0', 8);
  }

  function makeRoom(world, spec, startX, width){

  }

  function addSign(world, room, x, y, text, opts){
    var sign = ns.Signs.place(world.scene, x, y, text, opts || {});
    room.signs.push(sign);
    world.signs.push(sign);

  }

  function makePremium(world, room, x, y){
    var stamp = world.scene.add.rectangle(x, y, 16, 16, 0xfff9e0, 0.98).setDepth(12).setStrokeStyle(1, 0xc23b3b, 1);
    var mark = world.scene.add.text(x, y, '$', {
      fontFamily: 'monospace',
      fontSize: '8px',
      color: '#c23b3b',
      align: 'center'
    }).setOrigin(0.5).setDepth(13);
    var premium = {
      rect: stamp,
      label: mark,
      room: room,
      collected: false,
      collect: function(){
        if (premium.collected) return;
        premium.collected = true;
        premium.rect.setVisible(false);
        premium.label.setVisible(false);
        room.premiumCount += 1;
        world.stats.premiumsCollected += 1;
        if (ns.Events && ns.Events.emit) ns.Events.emit('form:used', { kind: 'premium', x: x, y: y });
        updateRunState(world);
      },
      destroy: function(){
        destroyThing(premium.rect);
        destroyThing(premium.label);
      }
    };
    room.premiums.push(premium);
    world.premiums.push(premium);
    return premium;
  }

  function makeHazard(world, room, x, y, w, h, kind){
    var zone = world.scene.add.rectangle(x, y, w, h, 0x7a2e2e, 0.45).setDepth(5);
    var hazard = {
      rect: zone,
      room: room,
      kind: kind || 'hazard',
      update: function(player){
        if (!player || player.invulnMs > 0 || !intersects(player, zone)) return;
        if (ns.Events && ns.Events.emit) ns.Events.emit('combat:damageTaken', { kind: hazard.kind, amount: 1 });
        if (room.uninsuredCommitted) {
          room.damageTagged = true;
          world.receiptFlags.uninsuredVeteran = true;
          world.receiptFlags.premiumSecured = false;
          updateRunState(world);
        }
        if (player.takeHit) player.takeHit(hazard.kind);
      },
      destroy: function(){ destroyThing(zone); }
    };
    room.hazards.push(hazard);
    world.hazards.push(hazard);
    return hazard;
  }

  function addEnemy(world, room, type, opts){
    opts = opts || {};
    opts.rng = opts.rng || world.enemyRng;
    var enemy = ns.Enemies && ns.Enemies.spawn ? ns.Enemies.spawn(world.scene, type, opts) : null;
    if (!enemy) return null;
    room.enemies.push(enemy);
    world.enemies.push(enemy);
    return enemy;
  }

  function pathwayGate(world, room, spec, cfg){
    var scene = world.scene;
    var horizon = world.horizon;
    var baseX = cfg.baseX;
    var sign = addSign(world, room, baseX + 18, horizon - 82, spec.contradictionSign, { id: room.id + '-coverage-sign' });
    var lamp = scene.add.rectangle(baseX + 82, horizon - 92, 10, 10, 0x8b6f74, 1).setDepth(11);
    var upperDoor = staticRect(scene, baseX + 470, horizon - 106, 20, 84, 0xc23b3b, 1, 6);
    var lowerTrigger = sensorZone(scene, baseX + 620, horizon - 26, 220, 86);
    var upperClear = sensorZone(scene, baseX + 880, horizon - 122, 220, 88);

    addPlatform(world, room, baseX + 248, horizon - 34, 96, 14, 0xffe7be, 1, 4);
    addPlatform(world, room, baseX + 334, horizon - 70, 96, 14, 0xffe7be, 1, 4);
    addPlatform(world, room, baseX + 420, horizon - 106, 96, 14, 0xffe7be, 1, 4);
    addPlatform(world, room, baseX + 608, horizon - 126, 208, 18, 0xfff1c8, 1, 4);
    addPlatform(world, room, baseX + 854, horizon - 126, 190, 18, 0xfff1c8, 1, 4);

    room.gate = {
      sign: sign,
      lamp: lamp,
      upperDoor: upperDoor,
      lowerTrigger: lowerTrigger,
      upperClear: upperClear,
      unlocked: false,
      skipped: false,
      followed: false,
      unlock: function(){
        if (room.gate.unlocked) return;
        room.gate.unlocked = true;
        destroyThing(room.gate.upperDoor);
        room.gate.lamp.fillColor = 0x5b8f6a;
        room.branchOutcome = 'insured';
        if (ns.Events && ns.Events.emit) ns.Events.emit('module:passed', {
          roomId: room.id,
          moduleId: room.id + '-premium-path'
        });
      },
      commitLower: function(){
        if (room.gate.unlocked || room.gate.skipped) return;
        room.gate.skipped = true;
        room.uninsuredCommitted = true;
        room.branchOutcome = 'uninsured';
        room.gate.lamp.fillColor = 0xe04a3a;
        world.lastContradictionOutcome = 'defy';
        if (ns.Events && ns.Events.emit) {
          ns.Events.emit('module:skipped', {
            roomId: room.id,
            moduleId: room.id + '-premium-path'
          });
          ns.Events.emit('contradiction:defy', { gateId: sign.id, action: 'move', elapsedMs: 120 });
        }
      },
      markSafe: function(){
        if (!room.gate.unlocked || room.safeCompleted) return;
        room.safeCompleted = true;
        room.branchOutcome = 'insured';
        world.lastContradictionOutcome = 'follow';
        if (!room.gate.followed && ns.Events && ns.Events.emit) {
          room.gate.followed = true;
          ns.Events.emit('contradiction:follow', { gateId: sign.id, action: 'wait', elapsedMs: 900 });
        }
      }
    };

    return room.gate;
  }

  function applyPizzaParty(world){
    setJumpPenalty(world, world.stats.jumpPenalty - 16);

    updateRunState(world);

  function applyDeductibleHit(world){
    world.player.invulnMs = 420;
    world.stats.deductibleHits += 1;
    if (ns.Events && ns.Events.emit) ns.Events.emit('combat:damageTaken', { kind: 'deductible', amount: 1 });
    setJumpPenalty(world, world.stats.jumpPenalty + 16);
    if (world.currentRoom && world.currentRoom.uninsuredCommitted) {
      world.currentRoom.damageTagged = true;
      world.receiptFlags.uninsuredVeteran = true;
      world.receiptFlags.premiumSecured = false;

      world.receiptFlags.uninsuredVeteran = true;

  function updatePremiums(world){
    var room = world.currentRoom;
    if (!room) return;
    for (var i = 0; i < room.premiums.length; i++) {
      if (!room.premiums[i].collected && intersects(world.player, room.premiums[i].rect)) {
        room.premiums[i].collect();
      }
    }
  }

  function updateSigns(world){
    var room = world.currentRoom;
    if (!room) return;
    for (var i = 0; i < room.signs.length; i++) readSign(world, room.signs[i]);
    if (room.gate && room.gate.sign) readSign(world, room.gate.sign);
    if (room.finalSign) readSign(world, room.finalSign);
  }

  function updateGate(world){
    var room = world.currentRoom;
    if (!room || !room.gate) return;
    if (!room.gate.unlocked && room.premiumCount >= room.premiumTarget) room.gate.unlock();
    if (!room.gate.unlocked && intersects(world.player, room.gate.lowerTrigger)) room.gate.commitLower();
    if (room.gate.unlocked && intersects(world.player, room.gate.upperClear)) room.gate.markSafe();
  }

  function updateHazards(world){
    var room = world.currentRoom;
    if (!room) return;
    for (var i = 0; i < room.hazards.length; i++) room.hazards[i].update(world.player);
  }

  function updateEnemies(world, dtMs){
    var room = world.currentRoom;
    if (!room) return;
    for (var i = 0; i < room.enemies.length; i++) {
      if (room.enemies[i] && room.enemies[i].update) room.enemies[i].update(world.player, world, dtMs);
    }
  }

  function resetDebug(world){
    ns.Axes.reset();
    if (ns.Metrics && ns.Metrics.reset) ns.Metrics.reset();
    world.scene.recorder.clear();
    world.scene.pendingDeath = null;
    world.scene.runComplete = false;
    world.scene.runStartMs = world.scene.time.now;
    world.lastContradictionOutcome = '';
    world.visitedRooms = {};
    world.roomOrder.length = 0;
    world.currentRoom = null;
    world.currentRoomId = world.rooms[0].id;
    world.runState.roomOrder = world.roomOrder;
    world.runState.actionsLearned = [];
    world.runState.receipt = null;
    world.runState.receiptFlags = { uninsuredVeteran:false, premiumSecured:false };
    world.runState.worldStats = {
      premiumsCollected: 0,
      premiumRoomsCleared: 0,
      deductibleHits: 0,
      jumpPenalty: 0,
      occlusionUntil: 0
    };
    world.receiptFlags = world.runState.receiptFlags;
    world.stats = world.runState.worldStats;
    world.enemyRng = ns.makeRNG ? ns.makeRNG(world.runState.caseSeed + '|benefits|enemies') : null;
    setJumpPenalty(world, 0);
    world.player.invulnMs = 0;
    ns.Movement.respawn(world.player);
    for (var i = 0; i < world.rooms.length; i++) {
      world.rooms[i].premiumCount = 0;
      world.rooms[i].safeCompleted = false;
      world.rooms[i].uninsuredCommitted = false;
      world.rooms[i].damageTagged = false;
      world.rooms[i].branchOutcome = '';
      world.rooms[i].finalized = false;
      if (world.rooms[i].gate) {
        world.rooms[i].gate.unlocked = false;
        world.rooms[i].gate.skipped = false;
        world.rooms[i].gate.followed = false;
        world.rooms[i].gate.lamp.fillColor = 0x8b6f74;
        if (world.rooms[i].gate.upperDoor && !world.rooms[i].gate.upperDoor.scene) {
          world.rooms[i].gate.upperDoor = staticRect(world.scene, world.rooms[i].gate.upperClear.x - 410, world.horizon - 106, 20, 84, 0xc23b3b, 1, 6);
        }
      }
      for (var j = 0; j < world.rooms[i].premiums.length; j++) {
        world.rooms[i].premiums[j].collected = false;
        world.rooms[i].premiums[j].rect.setVisible(true);
        world.rooms[i].premiums[j].label.setVisible(true);
      }
    }
    rememberRoom(world, world.rooms[0].id);
    world.currentRoom = world.rooms[0];
    setRoomRespawn(world, world.rooms[0]);
  }

  function scriptRoom(world, room, style, markers){
    var insured = style === 'insured';
    var laneY = insured ? world.horizon - 140 : world.horizon - 28;
    var roomIndex = world.rooms.indexOf(room);
    world.player.x = room.startX + 80;
    world.player.y = laneY;
    syncCurrentRoom(world);
    world.scene.recorder.mark(markers[0], world.player.x, world.player.y, 1);

    for (var i = 0; i < room.signs.length; i++) {
      room.signs[i].peek({ signId: room.signs[i].id, words: room.signs[i].text.split(/\s+/).length });
      room.signs[i].read({ signId: room.signs[i].id, words: room.signs[i].text.split(/\s+/).length });
    }
    if (room.gate && room.gate.sign) {
      room.gate.sign.peek({ signId: room.gate.sign.id, words: room.gate.sign.text.split(/\s+/).length });
      room.gate.sign.read({ signId: room.gate.sign.id, words: room.gate.sign.text.split(/\s+/).length });
    }

    if (insured) {
      for (i = 0; i < room.premiums.length; i++) room.premiums[i].collect();
      room.gate.unlock();
      room.gate.markSafe();
      if (room.id === 'wellness-incentive' || room.id === 'final-processing') applyPizzaParty(world);
      if (room.id === 'deductible-adjustment') applyDeductibleHit(world);
      if (room.id === 'wellness-incentive') setJumpPenalty(world, Math.max(0, world.stats.jumpPenalty - 16));
      if (ns.Events && ns.Events.emit) ns.Events.emit('music:sync', { x: room.endX - 160, y: world.horizon - 140 });
      world.scene.recorder.mark(markers[1], room.startX + 420, world.horizon - 96, 1);
      world.scene.recorder.mark(markers[2], room.startX + 860, world.horizon - 126, 1);
    } else {
      room.gate.commitLower();
      if (room.id === 'enrollment-intake' || room.id === 'premium-pathways' || room.id === 'network-validation') {
        room.damageTagged = true;
        world.receiptFlags.uninsuredVeteran = true;
        world.receiptFlags.premiumSecured = false;
        if (ns.Events && ns.Events.emit) {
          ns.Events.emit('combat:damageTaken', { kind: 'uninsured-lane', amount: 1 });
          ns.Events.emit('player:death', { source: 'uninsured-lane' });
        }
      }
      if (room.id === 'deductible-adjustment' || room.id === 'wellness-incentive' || room.id === 'final-processing') {
        applyDeductibleHit(world);
      }
      if (ns.Events && ns.Events.emit) ns.Events.emit('movement:nearMiss', { x: room.startX + 940, y: world.horizon - 12 });
      world.scene.recorder.mark(markers[1], room.startX + 430, world.horizon - 20, 1);
      world.scene.recorder.mark(markers[2], room.startX + 940, world.horizon - 12, 1);
    }

    updateRunState(world);
    world.player.x = room.endX - 120;
    world.player.y = insured ? world.horizon - 126 : world.horizon - 28;
    syncCurrentRoom(world);
    finalizeRoom(world, room);
    world.scene.recorder.mark(markers[3], world.player.x, world.player.y, 1);
  }

  function runStyle(world, scene, style){
    if (scene.runComplete && world.runState.receipt) {
      return {
        receipt: clone(world.runState.receipt),
        axes: clone(ns.Axes.snapshot()),
        frames: clone(scene.recorder.dump()),
        contradictionOutcome: world.lastContradictionOutcome || '',
        worldId: world.runState.worldId,
        roomOrder: clone(world.roomOrder),
        worldStats: clone(world.stats),
        receiptFlags: clone(world.receiptFlags)
      };
    }

    style = style || 'insured';
    resetDebug(world);

    var markers = [
      [0, 180, 380, 560],
      [620, 800, 980, 1160],
      [1220, 1400, 1580, 1760],
      [1820, 2000, 2180, 2360],
      [2420, 2600, 2780, 2960],
      [3020, 3200, 3380, 3560]
    ];

    for (var i = 0; i < world.rooms.length; i++) scriptRoom(world, world.rooms[i], style, markers[i]);

    if (!world.receiptFlags.uninsuredVeteran && world.stats.premiumRoomsCleared >= 4) {
      world.receiptFlags.premiumSecured = true;
      updateRunState(world);
    }
    world.player.x = world.goal.x;
    world.player.y = world.goal.y;
    finalizeRoom(world, world.currentRoom);
    scene.completeRun('debug:' + style);

    return {
      receipt: clone(world.runState.receipt),
      axes: clone(ns.Axes.snapshot()),
      frames: clone(scene.recorder.dump()),
      contradictionOutcome: world.lastContradictionOutcome || '',
      worldId: world.runState.worldId,
      roomOrder: clone(world.roomOrder),
      worldStats: clone(world.stats),
      receiptFlags: clone(world.receiptFlags)
    };
  }

  function create(scene, runState){
    var manifest = ns.Worlds && ns.Worlds.get ? ns.Worlds.get('benefits') : null;
    var roomWidth = 1280;
    var horizon = ns.GAME_H - 24;
    var world = {
      id: 'benefits-world',
      worldId: 'benefits',
      scene: scene,
      runState: runState,
      manifest: manifest,
      horizon: horizon,
      width: roomWidth * 6,
      rooms: [],
      platforms: [],
      premiums: [],
      enemies: [],
      hazards: [],
      signs: [],
      goal: null,
      currentRoom: null,
      currentRoomId: 'enrollment-intake',
      roomOrder: [],
      visitedRooms: {},
      lastContradictionOutcome: '',
      stats: runState.worldStats || {
        premiumsCollected: 0,
        premiumRoomsCleared: 0,
        deductibleHits: 0,
        jumpPenalty: 0,
        occlusionUntil: 0
      },
      receiptFlags: runState.receiptFlags || {
        uninsuredVeteran:false,
        premiumSecured:false
      },
      enemyRng: ns.makeRNG ? ns.makeRNG(runState.caseSeed + '|benefits|enemies') : null
    };
    world.applyPizzaParty = function(){ applyPizzaParty(world); };
    world.applyDeductibleHit = function(){ applyDeductibleHit(world); };
    world.hitByEnemy = function(kind){ hitByEnemy(world, kind); };

    scene.cameras.main.setBackgroundColor('#21151a');
    scene.physics.world.setBounds(0, 0, world.width, ns.GAME_H);
    scene.cameras.main.setBounds(0, 0, world.width, ns.GAME_H);

    world.player = ns.Movement.createEd(scene, 72, horizon - 28);
    world.player.jumpVelocity = ns.TUNING.JUMP_VELOCITY;
    scene.player = world.player;

    runState.worldId = 'benefits';
    runState.roomId = manifest.rooms[0].id;
    runState.roomOrder = world.roomOrder;
    runState.actionsLearned = [];
    runState.worldFlags = manifest || {};
    updateRunState(world);

    buildEnrollment(world, manifest.rooms[0], 0, roomWidth);
    buildPathways(world, manifest.rooms[1], roomWidth, roomWidth);
    buildNetwork(world, manifest.rooms[2], roomWidth * 2, roomWidth);
    buildDeductible(world, manifest.rooms[3], roomWidth * 3, roomWidth);
    buildWellness(world, manifest.rooms[4], roomWidth * 4, roomWidth);
    buildFinal(world, manifest.rooms[5], roomWidth * 5, roomWidth);

    for (var i = 0; i < world.platforms.length; i++) {
      scene.physics.add.collider(world.player, world.platforms[i]);
    }

    scene.physics.add.overlap(world.player, world.goal, function(){
      finalizeRoom(world, world.currentRoom);
      if (!world.receiptFlags.uninsuredVeteran && world.stats.premiumRoomsCleared >= 4) {
        world.receiptFlags.premiumSecured = true;
        updateRunState(world);
      }
      scene.completeRun('goal');
    });

    rememberRoom(world, manifest.rooms[0].id);
    world.currentRoom = world.rooms[0];
    setRoomRespawn(world, world.rooms[0]);
    return world;
  }

  function update(scene, dtMs){
    var world = scene.room;
    if (!world || !world.player) return;
    syncCurrentRoom(world);
    updateSigns(world);
    updatePremiums(world);
    updateGate(world);

  function microValue(val){

    if (val <= 1) return val;
    return Math.min(1, val / 3);

        value = tensions[key];
        if (key === 'style') {
          value = Math.max(0, Math.min(2, tensions[key] || 0));
          score += (1 - Math.min(1, value / 2)) * fragment.lowTensions[key];
        } else {
          score += (1 - Math.min(1, Math.max(-1, value || 0) + 1)) * fragment.lowTensions[key];
        }
      }
    }

    if (fragment.micro) {
      for (key in fragment.micro) {
        if (!Object.prototype.hasOwnProperty.call(fragment.micro, key)) continue;
        score += microValue(micro[key] || 0) * fragment.micro[key];
      }
    }

    if (fragment.worlds && context.worldId && fragment.worlds[context.worldId]) {
      score += fragment.worlds[context.worldId];
    }

    if (fragment.flags) {
      for (key in fragment.flags) {
        if (!Object.prototype.hasOwnProperty.call(fragment.flags, key)) continue;
        if (key === 'cigaretteLit') {
          if (context.cigaretteLit === fragment.flags[key]) score += 1.5;
          continue;
        }
        if (context.flags && context.flags[key] === fragment.flags[key]) score += 1.8;
      }
    }

    return score;

    var scored = [];
    for (var i = 0; i < list.length; i++) {
      scored.push({
        fragment: list[i],
        score: scoreFragment(list[i], axes, tensions, context),
        tie: tieBreaker(context.seed, list[i].id)
      });
    }

    scored.sort(function(a, b){
      if (b.score !== a.score) return b.score - a.score;
      if (a.tie === b.tie) return 0;
      return a.tie < b.tie ? -1 : 1;

    var tens = normalTensions(opts.tensions || (ns.Axes ? ns.Axes.tensions() : null));

      cigaretteLit: opts.cigaretteLit !== false,
      flags: opts.flags || {}

    var closers = CLOSERS.concat(worldClosers(context.worldId));

    if (!rng) {
      return {
      seed: seed,
      lines: [VERDICTS[0].text, TENSIONS[0].text, closers[0].text],
      fragmentIds: [VERDICTS[0].id, TENSIONS[0].id, closers[0].id],
      cigaretteLit: context.cigaretteLit,
      axes: axes,
      tensions: tens
    };
  }

    var verdict = pickPriority(rng, VERDICTS, axes, tens, context);
    var tension = pickPriority(rng, TENSIONS, axes, tens, context);
    var closer  = pickPriority(rng, closers, axes, tens, context);

    return {

    var width = Math.max(1, bounds.maxX - bounds.minX);
    var height = Math.max(1, bounds.maxY - bounds.minY);

    function drawPath(path, color){
      if (!path || path.length < 2) return;
      g.lineStyle(2, color, 0.9);
      g.beginPath();
      for (var i = 0; i < path.length; i++) {
        var px = area.x + ((path[i][1] - bounds.minX) / width) * area.w;
        var py = area.y + ((path[i][2] - bounds.minY) / height) * area.h;
        if (i === 0) g.moveTo(px, py);
        else g.lineTo(px, py);
      }
      g.strokePath();
    }

    drawPath(pathA, 0xf7c948);
    drawPath(pathB, 0x67a7d9);
  }

    signText(scene, 46, 70, 'K KICK');
    signText(scene, 46, 84, 'L DASH');
    signText(scene, 46, 98, 'C COPTER');
    signText(scene, 46, 112, 'V SLAM');
    signText(scene, 46, 126, 'B GLIDE');

    var player = scene.player;
    var time = scene.time.now;

    if (ns.Collision.intersects(player, room.sign.sensor)) {
      room.sign.peek({ signId: room.sign.id, words: 3 });
      if (ns.Input.justPressed('up')) room.sign.read({ signId: room.sign.id, words: 3 });

    if (ns.Collision.intersects(player, room.signB.sensor)) {

      room.gate.evaluate({

    room.signB.updateFromAxes(ns.Axes.snapshot());

    if (player.body.blocked.down && Math.abs(player.body.velocity.x) > 160) {
      if (ns.Events && ns.Events.emit) ns.Events.emit('music:sync', { x: player.x, y: player.y });
